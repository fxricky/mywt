version: 2

builds:
  - id: mywt
    binary: mywt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X github.com/fxricky/mywt/internal/version.version={{ .Tag }}

archives:
  - id: mywt
    formats: [binary]
    name_template: "mywt_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: mywt_checksums.txt
  algorithm: sha256

source:
  enabled: false

changelog:
  disable: true

snapshot:
  version_template: "{{ .Version }}-snapshot"

release:
  draft: true
  prerelease: auto
  # mode is release-notes handling. keep-existing does not rewrite notes.
  # replace_existing_artifacts false makes an upload fail when the asset is
  # already there. CI also refuses to run when the release itself exists.
  mode: keep-existing
  replace_existing_artifacts: false
  replace_existing_draft: false
