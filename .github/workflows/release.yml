name: Release

# Two ways to start a release. Only one run publishes it.
#
# workflow_dispatch (Actions, Release, Run workflow) takes a version and
# must be started from main. After the release environment is approved, the
# publish job creates the tag at this run's GITHUB_SHA and pushes it with
# the workflow GITHUB_TOKEN. A tag push authenticated as GITHUB_TOKEN does
# not start the push trigger, so this run is the only one.
# https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
#
# push of v*.*.* is what scripts/release.sh does. That push uses the
# pusher's credentials, not GITHUB_TOKEN, so this workflow starts. The tag
# already exists; the publish job does not create another one.
#
# Both paths then create a draft with `gh release create --draft
# --verify-tag`, upload the assets without replacing existing names, compare
# the download to dist/, and publish the draft. A release that already
# exists is left alone. The assets are attached before the release is
# published, which is what immutable releases require.
#
# The tag name is passed to the shell through RELEASE_TAG. Nothing in a
# `run` script reads ${{ }}.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.1.0 or v1.1.0"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

# Jobs opt in below. The build job cannot publish. The publish job is the
# only one that can create a tag, upload release assets, or write an
# attestation.
permissions: {}

# 1.1.0 and v1.1.0 share a group with a pushed v1.1.0 tag. On a tag push,
# github.event.inputs.version is empty and the group is github.ref_name.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version)) || github.ref_name }}
  RELEASE_EVENT: ${{ github.event_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # upload-artifact needs this once the workflow token starts with no
      # permissions. It does not allow the build job to write repository contents.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release ref
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: ${RELEASE_TAG} is not a valid semver tag; refusing to build" >&2
            exit 1
          fi
          git fetch origin main --tags
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "error: workflow_dispatch must run from refs/heads/main (got ${GITHUB_REF})" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
              echo "error: checked out $(git rev-parse HEAD), expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
            if [ -n "$remote_tag" ]; then
              echo "error: tag ${RELEASE_TAG} already exists; refusing to build" >&2
              exit 1
            fi
          else
            git checkout --detach "$RELEASE_TAG"
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: ${RELEASE_TAG} ($(git rev-parse HEAD)) is not on origin/main; refusing to build" >&2
            exit 1
          fi

      - name: Require no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          set -euo pipefail
          err="$(mktemp)"
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>"$err"; then
            echo "error: release ${RELEASE_TAG} already exists; refusing to build" >&2
            exit 1
          fi
          if ! grep -Eqi 'release not found' "$err"; then
            echo "error: could not confirm release ${RELEASE_TAG} is absent; refusing to build" >&2
            cat "$err" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build
        run: scripts/build-release.sh "$RELEASE_TAG"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/mywt_darwin_arm64
            dist/mywt_darwin_amd64
            dist/mywt_checksums.txt
          if-no-files-found: error
          overwrite: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      # download-artifact from this workflow run needs this once the workflow
      # token starts with no permissions.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release ref
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: ${RELEASE_TAG} is not a valid semver tag; refusing to publish" >&2
            exit 1
          fi
          git fetch origin main --tags
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "error: workflow_dispatch must run from refs/heads/main (got ${GITHUB_REF})" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
              echo "error: checked out $(git rev-parse HEAD), expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
            if [ -n "$remote_tag" ]; then
              echo "error: tag ${RELEASE_TAG} already exists; refusing to publish" >&2
              exit 1
            fi
          else
            git checkout --detach "$RELEASE_TAG"
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: ${RELEASE_TAG} ($(git rev-parse HEAD)) is not on origin/main; refusing to publish" >&2
            exit 1
          fi

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mywt_darwin_arm64
            dist/mywt_darwin_amd64

      - name: Create the release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          if [ -n "$remote_tag" ]; then
            echo "error: tag ${RELEASE_TAG} already exists; refusing to create a release" >&2
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          # Credentials come from GH_TOKEN for this push only. Checkout does
          # not persist a token. The pusher is github-actions[bot], so the
          # tag push does not start the push trigger of this workflow.
          git \
            -c credential.https://github.com.helper= \
            -c 'credential.https://github.com.helper=!gh auth git-credential' \
            push origin "refs/tags/${RELEASE_TAG}"
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          got="$(git rev-parse "${RELEASE_TAG}^{}")"
          if [ "$got" != "$GITHUB_SHA" ]; then
            echo "error: ${RELEASE_TAG} points at ${got}, not ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: scripts/publish-release.sh "$RELEASE_TAG"
