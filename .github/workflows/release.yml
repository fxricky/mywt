name: Release

# A release build runs only when a GitHub release is published.
#
# Creating a release on the Releases page creates the tag and publishes the
# release together. That is one `release: published` event. Pushing the tag
# by itself is not a trigger, so the same release does not build twice.
# scripts/release.sh creates the tag and then publishes the release with
# `gh release create --verify-tag`, which is the same event.
#
# The build checks that the release tag's commit is on main, then
# scripts/build-release.sh writes the macOS binaries. The publish job attests
# them and uploads them onto the release that already exists. It does not
# create, edit, or delete a release. An asset name that is already present
# fails the job.
#
# For a release event, GITHUB_SHA is the tagged commit and GITHUB_REF is
# refs/tags/<tag>. The tag name still comes from the event payload through
# the RELEASE_TAG environment variable.
#
# The concurrency group stops two runs for the same tag from uploading at
# once. It is not a second trigger.
on:
  release:
    types: [published]

# Jobs opt in below. The build job cannot publish, and the publish job is
# the only one that can upload release assets or write an attestation.
permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # upload-artifact needs this once the workflow token starts with no
      # permissions. It does not allow the build job to write repository contents.
      actions: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release tag on main
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: ${RELEASE_TAG} is not a valid semver tag; refusing to build" >&2
            exit 1
          fi
          git fetch origin main --tags
          git checkout --detach "$RELEASE_TAG"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: ${RELEASE_TAG} ($(git rev-parse HEAD)) is not on origin/main; refusing to build" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build
        run: scripts/build-release.sh "$RELEASE_TAG"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/mywt_darwin_arm64
            dist/mywt_darwin_amd64
            dist/mywt_checksums.txt
          if-no-files-found: error
          overwrite: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      # download-artifact from this workflow run needs this once the workflow
      # token starts with no permissions.
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release tag on main
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: ${RELEASE_TAG} is not a valid semver tag; refusing to publish" >&2
            exit 1
          fi
          git fetch origin main --tags
          git checkout --detach "$RELEASE_TAG"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: ${RELEASE_TAG} ($(git rev-parse HEAD)) is not on origin/main; refusing to publish" >&2
            exit 1
          fi

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mywt_darwin_arm64
            dist/mywt_darwin_amd64

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$RELEASE_TAG"
