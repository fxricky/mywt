name: Release

# A release build runs only when a version tag is pushed.
#
# Creating a tag on the GitHub website, or `git push origin v1.0.0`, is a
# tag push. This workflow runs once. `release: published` is not a trigger.
#
# Build and archive settings live in .goreleaser.yaml. This file checks that
# the tagged commit is on main, attests the binaries, and publishes the draft
# only after the uploaded checksums match. If a release for the tag already
# exists, publish fails and leaves that release unchanged.
#
# The concurrency group stops two runs for the same tag from publishing at
# once. It is not a second trigger.
on:
  push:
    tags:
      - "v*.*.*"

# Jobs opt in below. The build job cannot publish, and the publish job is
# the only one that can write a release or an attestation.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # upload-artifact needs this once the workflow token starts with no
      # permissions. It does not allow the build job to write repository contents.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: ${GITHUB_SHA} is not on origin/main; refusing to build a release" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          overwrite: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      # download-artifact from this workflow run needs this once the workflow
      # token starts with no permissions.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: ${GITHUB_SHA} is not on origin/main; refusing to publish" >&2
            exit 1
          fi

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mywt_darwin_arm64_*/mywt
            dist/mywt_darwin_amd64_*/mywt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "${GITHUB_REF_NAME}"
